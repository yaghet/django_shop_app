services:
  django-app:
    build:
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    restart: always
    env_file:
      - .env
    develop:
      watch:
        - action: sync+restart
          path: ./online-shop
          target: /app
        - action: rebuild
          path: ./uv.lock
    depends_on:
      - pgdb

  pgdb:
    image: postgres:14-alpine
    restart: always
    environment:
      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
    container_name: pgdb
    volumes:
      - pgdbdata:/var/lib/postgresql/data/
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER}" ]
      interval: 7s
      timeout: 5s
      retries: 3
volumes:
  pgdbdata:

networks:
  monitoring:
    driver: bridge